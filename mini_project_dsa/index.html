<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sudoku Solver</title>
  <style>
    body {
      background-color: #1c1c1c;
      color: #f2f2f2;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 2rem;
      min-height: 100vh;
      margin: 0;
      gap: 2rem;
    }

    h1 {
      margin-bottom: 10px;
    }

    .sudoku-container {
      display: flex;
      gap: 40px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(9, 45px);
      grid-template-rows: repeat(9, 45px);
      gap: 1px;
      background-color: #444;
      padding: 5px;
      border-radius: 10px;
    }

    .cell {
      background-color: #2e2e2e;
      border: 1px solid #444;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      border-radius: 4px;
    }

    .buttons {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    button {
      background-color: #444;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #666;
    }

    .analysis-box {
      background-color: #2a2a2a;
      padding: 20px;
      border-radius: 10px;
      border: 1px solid #555;
      min-width: 260px;
    }

    .analysis-box h2 {
      margin-top: 0;
      border-bottom: 1px solid #555;
      padding-bottom: 5px;
    }

    .analysis-box p {
      margin: 10px 0;
      font-size: 14px;
    }

    .highlight {
      background-color: #004466 !important;
    }
  </style>
</head>
<body>
  <h1>Sudoku Solver</h1>
  <div class="sudoku-container">
    <div class="board" id="board"></div>
    <div class="analysis-box">
      <h2>DSA Analysis</h2>
      <p><strong>Algorithm:</strong> Backtracking</p>
      <p><strong>Time Complexity:</strong> O(9^k) (k = empty cells)</p>
      <p><strong>Space Complexity:</strong> O(1) extra</p>
      <p><strong>Steps Taken:</strong> <span id="steps">0</span></p>
      <p><strong>Time Taken:</strong> <span id="time">0</span> ms</p>
    </div>
  </div>
  <div class="buttons">
    <button onclick="generatePuzzle()">Generate Puzzle</button>
    <button onclick="solveSudokuAnimated()">Solve (Animated)</button>
    <button onclick="showSolution()">See Solution</button>
    <button onclick="resetBoard()">Reset</button>
  </div>

  <script>
    const boardEl = document.getElementById('board');
    let board = Array(9).fill(null).map(() => Array(9).fill(''));
    let originalBoard = [];

    function renderBoard() {
      boardEl.innerHTML = '';
      board.forEach((row, r) => {
        row.forEach((num, c) => {
          const cell = document.createElement('div');
          cell.className = 'cell';
          if (num !== '') cell.textContent = num;
          boardEl.appendChild(cell);
        });
      });
    }

    function generatePuzzle() {
      fetch('https://sugoku.onrender.com/board?difficulty=medium')
        .then(res => res.json())
        .then(data => {
          board = data.board;
          originalBoard = JSON.parse(JSON.stringify(board));
          renderBoard();
        });
    }

    function resetBoard() {
      board = JSON.parse(JSON.stringify(originalBoard));
      renderBoard();
      document.getElementById('steps').textContent = 0;
      document.getElementById('time').textContent = 0;
    }

    function showSolution() {
      const solved = JSON.parse(JSON.stringify(originalBoard));
      solveSudoku(solved);
      board = solved;
      renderBoard();
    }

    function solveSudoku(grid) {
      for (let row = 0; row < 9; row++) {
        for (let col = 0; col < 9; col++) {
          if (grid[row][col] === 0) {
            for (let num = 1; num <= 9; num++) {
              if (isValid(grid, row, col, num)) {
                grid[row][col] = num;
                if (solveSudoku(grid)) return true;
                grid[row][col] = 0;
              }
            }
            return false;
          }
        }
      }
      return true;
    }

    function isValid(grid, row, col, num) {
      for (let i = 0; i < 9; i++) {
        if (grid[row][i] === num || grid[i][col] === num || grid[3 * Math.floor(row / 3) + Math.floor(i / 3)][3 * Math.floor(col / 3) + i % 3] === num) {
          return false;
        }
      }
      return true;
    }

    async function solveSudokuAnimated() {
      let start = performance.now();
      let steps = 0;
      const delay = (ms) => new Promise(res => setTimeout(res, ms));

      async function helper(row, col) {
        if (row === 9) return true;
        if (col === 9) return await helper(row + 1, 0);
        if (board[row][col] !== 0 && board[row][col] !== '') return await helper(row, col + 1);

        for (let num = 1; num <= 9; num++) {
          if (isValid(board, row, col, num)) {
            board[row][col] = num;
            steps++;
            renderBoard();
            await delay(15);
            if (await helper(row, col + 1)) return true;
            board[row][col] = 0;
          }
        }
        return false;
      }

      await helper(0, 0);
      let end = performance.now();
      document.getElementById('steps').textContent = steps;
      document.getElementById('time').textContent = Math.round(end - start);
      renderBoard();
    }

    generatePuzzle();
  </script>
</body>
</html>
