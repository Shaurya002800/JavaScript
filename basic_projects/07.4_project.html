<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>6 Maze Solver Comparison</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      text-align: center;
      margin: 20px;
    }

    #mazes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-gap: 20px;
      padding: 20px;
    }

    .maze-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .label {
      margin-bottom: 10px;
      font-weight: bold;
    }

    canvas {
      border: 2px solid #0f0;
      box-shadow: 0 0 10px #0f0;
    }

    button {
      background-color: #0f0;
      color: black;
      font-weight: bold;
      padding: 10px 20px;
      margin-top: 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    button:hover {
      background-color: #0c0;
    }
  </style>
</head>
<body>
  <h1>Maze Solver Comparison</h1>
  <div id="mazes">
    <div class="maze-container">
      <div class="label">BFS</div>
      <canvas id="maze0" width="200" height="200"></canvas>
    </div>
    <div class="maze-container">
      <div class="label">DFS</div>
      <canvas id="maze1" width="200" height="200"></canvas>
    </div>
    <div class="maze-container">
      <div class="label">Random Walk</div>
      <canvas id="maze2" width="200" height="200"></canvas>
    </div>
    <div class="maze-container">
      <div class="label">A* (Coming Soon)</div>
      <canvas id="maze3" width="200" height="200"></canvas>
    </div>
    <div class="maze-container">
      <div class="label">Bidirectional BFS (Coming Soon)</div>
      <canvas id="maze4" width="200" height="200"></canvas>
    </div>
    <div class="maze-container">
      <div class="label">Wall Follower (Coming Soon)</div>
      <canvas id="maze5" width="200" height="200"></canvas>
    </div>
  </div>
  <button onclick="solveAllMazes()">Solve All</button>

  <script>
    const rows = 20, cols = 20, cellSize = 10;

    class Maze {
      constructor(canvas, type) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.grid = this.generateGrid();
        this.type = type;
      }

      generateGrid() {
        const grid = Array.from({ length: rows }, () => Array(cols).fill(0));
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (Math.random() < 0.3) grid[r][c] = 1; // wall
          }
        }
        grid[0][0] = 0; // start
        grid[rows - 1][cols - 1] = 0; // end
        return grid;
      }

      draw() {
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            this.ctx.fillStyle = this.grid[r][c] === 1 ? '#0f0' : '#000';
            this.ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
          }
        }
      }

      solve() {
        if (this.type === 'BFS') this.bfs();
        else if (this.type === 'DFS') this.dfs();
        else if (this.type === 'Random') this.randomWalk();
      }

      bfs() {
        const queue = [[0, 0]];
        const visited = Array.from({ length: rows }, () => Array(cols).fill(false));
        visited[0][0] = true;

        const parent = {};
        while (queue.length) {
          const [r, c] = queue.shift();
          if (r === rows - 1 && c === cols - 1) break;

          for (const [dr, dc] of [[0,1],[1,0],[-1,0],[0,-1]]) {
            const [nr, nc] = [r + dr, c + dc];
            if (nr >= 0 && nc >= 0 && nr < rows && nc < cols && !visited[nr][nc] && this.grid[nr][nc] === 0) {
              visited[nr][nc] = true;
              parent[`${nr},${nc}`] = [r, c];
              queue.push([nr, nc]);
            }
          }
        }

        let path = [], curr = [rows - 1, cols - 1];
        while (curr) {
          path.push(curr);
          curr = parent[`${curr[0]},${curr[1]}`];
        }
        this.animatePath(path.reverse());
      }

      dfs() {
        const visited = Array.from({ length: rows }, () => Array(cols).fill(false));
        const path = [];

        const dfsVisit = (r, c) => {
          if (r < 0 || c < 0 || r >= rows || c >= cols || visited[r][c] || this.grid[r][c] === 1) return false;
          visited[r][c] = true;
          path.push([r, c]);
          if (r === rows - 1 && c === cols - 1) return true;
          for (const [dr, dc] of [[0,1],[1,0],[-1,0],[0,-1]]) {
            if (dfsVisit(r + dr, c + dc)) return true;
          }
          path.pop();
          return false;
        }

        dfsVisit(0, 0);
        this.animatePath(path);
      }

      randomWalk() {
        const path = [[0, 0]];
        const visited = Array.from({ length: rows }, () => Array(cols).fill(false));
        let [r, c] = [0, 0];
        visited[r][c] = true;

        while (!(r === rows - 1 && c === cols - 1)) {
          const dirs = [[0,1],[1,0],[-1,0],[0,-1]].filter(([dr, dc]) => {
            const nr = r + dr, nc = c + dc;
            return nr >= 0 && nc >= 0 && nr < rows && nc < cols && this.grid[nr][nc] === 0 && !visited[nr][nc];
          });
          if (!dirs.length) break;
          const [dr, dc] = dirs[Math.floor(Math.random() * dirs.length)];
          r += dr; c += dc;
          visited[r][c] = true;
          path.push([r, c]);
        }

        this.animatePath(path);
      }

      animatePath(path) {
        let i = 0;
        const interval = setInterval(() => {
          if (i >= path.length) return clearInterval(interval);
          const [r, c] = path[i++];
          this.ctx.fillStyle = '#00f';
          this.ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
        }, 30);
      }
    }

    const mazeTypes = ['BFS', 'DFS', 'Random', 'none', 'none', 'none'];
    const mazes = mazeTypes.map((type, i) => new Maze(document.getElementById(`maze${i}`), type === 'none' ? 'Random' : type));
    mazes.forEach(m => m.draw());

    function solveAllMazes() {
      mazes.forEach(m => m.solve());
    }
  </script>
</body>
</html>
