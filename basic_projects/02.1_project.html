<!DOCTYPE html>

<body style="background-color: #515151; padding-left: 200px; padding-top: 30px; font-size: 25px;">
    <h1>BMI CALCULATOR</h1>
    <div style="font-size: 50px;">
    <form>
            <p>Height(in cm):
            <input style="font-size: 20px;" type="text" id="height">
            </p> 
            <p>Weight(in Kg):
            <input style="font-size: 20px;" type="text" id="weight">
            </p>

            <button style="font-size: 50px; border-radius: 10px;"> Calculate </button>
            <br>
            <div id ="result"></div>
        </form>
    </div>
    <h2>BMI Weight Guide</h2>
    <p>Under Weight = Less than 18.6</p>
    <p>Normal Range = 18.6 and 24.9</p>
    <p>Overweight = Greater than 24.9</p>
</body>
